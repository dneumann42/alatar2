# steam only exists in [multilib], which archinstall leaves disabled. The
# pacman module (a dependency of core) enables it, so this installs after
# `alatar install all` - or after `alatar install pacman` on its own.
[[package]]
name = "steam"
source = "arch"
tags = ["gaming"]

[[package]]
name = "lutris"
source = "arch"
tags = ["gaming"]
