# ─────────────────────────────────────────────────────────────
#  kitty.conf — Alatar palette (matches ~/.config/sway/appearance.conf)
#  Transparency works through the swayfx compositor, which also
#  blurs the wallpaper behind the window.
# ─────────────────────────────────────────────────────────────

# ── Font ──
font_family      AtkynsonMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
adjust_line_height  104%

# ── Colors: base ──
background            #111318
foreground            #e6eaf2

# ── Colors: 16-palette ──
color0   #191c24
color1   #f38ba8
color2   #a6e3a1
color3   #f9e2af
color4   #89b4fa
color5   #f5c2e7
color6   #94e2d5
color7   #c3cadb
color8   #45475a
color9   #f0a3bb
color10  #b6e4b5
color11  #f4e4bf
color12  #a0c2f8
color13  #f1ccea
color14  #a8e4dc
color15  #e6eaf2

# ── Cursor / selection ──
cursor            #89b4fa
cursor_text_color #111318
cursor_shape      beam

selection_foreground #111318
selection_background #74c7ec

# ── Transparency ──
# Note: what you see through is whatever is BEHIND the window (wallpaper
# when floating over an empty workspace, or the tiled windows underneath).
# Lower = more see-through. Dial it live per window with
# ctrl+shift+alt+equal / minus, reset with ctrl+shift+alt+backspace.
background_opacity          0.65
dynamic_background_opacity  yes

# ── Links ──
url_color   #74c7ec
url_style   curly

# ── Tabs (hidden while only one is open) ──
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2

active_tab_foreground   #e6eaf2
active_tab_background   #292e3a
inactive_tab_foreground #9aa4b2
inactive_tab_background #191c24

# ── Window ──
# sway/swayfx draws the borders (pixel 2, $accent when focused),
# so kitty keeps its own decorations off for a clean look.
hide_window_decorations yes
window_border_width     0pt
window_margin_width     4

# ── Behavior ──
enable_audio_bell      no
update_check_interval  0
scrollback_lines       20000
copy_on_select         clipboard
mouse_hide_wait        2.0
close_on_child_death   yes
confirm_os_window_close 0
strip_trailing_spaces  smart

# ── Key mappings ──
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+q     close_window

map alt+left      previous_tab
map alt+right     next_tab
map alt+1         goto_tab 1
map alt+2         goto_tab 2
map alt+3         goto_tab 3
map alt+4         goto_tab 4
map alt+5         goto_tab 5
map alt+6         goto_tab 6
map alt+7         goto_tab 7
map alt+8         goto_tab 8
map alt+9         goto_tab 9

map ctrl+shift+alt+equal    set_background_opacity +0.05
map ctrl+shift+alt+minus    set_background_opacity -0.05
map ctrl+shift+alt+backspace set_background_opacity 0.65
