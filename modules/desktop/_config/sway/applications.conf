set $term kitty
set $menu ~/.config/sway/scripts/wofi.sh
set $browser waterfox

# mako reads the wallust theme generated into ~/.cache/wallust/mako.conf
# (template: _config/wallust/templates/mako.conf.j2); the wallust hook
# `makoctl reload` re-applies it on every wallpaper change. exec_always
# re-runs this on sway reload, so a config change here needs no restart -
# the duplicate mako that reload spawns just loses the bus name and exits.
exec_always --no-startup-id mako --config $HOME/.cache/wallust/mako.conf
exec_always --no-startup-id ~/.config/sway/scripts/bar-buttons.sh

# Pamac update notifier. The appindicator/SNI tray build registers over
# DBus, so its icon lands in swaybar's own tray (tray_output * in bar.conf)
# and its notifications go through libnotify to the mako above — no extra
# integration needed. Upstream's pamac-tray.desktop forces GDK_BACKEND=x11
# for the StatusIcon fallback build; do not copy that here: under sway the
# SNI path is backend-independent and wayland-native is what we want.
# If 'check for updates' is disabled in pamac's preferences the tray
# exits by itself on start (refresh_period == 0).
exec_always --no-startup-id pamac-tray

# Thunderbird: kept running headless-ish — autostarted and parked on
# workspace 9 by window-rules.conf. New-mail alerts go through libnotify
# to the mako above (alerts.useSystemBackend is on by default). There is
# no daemon mode (-daemon died with TB 3.x); the running instance is the
# daemon. A second `thunderbird` invocation hands off to this one and
# exits, so reloads do not stack instances.
exec_always --no-startup-id thunderbird

# apps/tray: the SNI tray host (tinydbus) - icons on the bar's right edge
# and real dbusmenu popups (swaybar's tray is icon-only: `// TODO menu`).
# Needs bar.conf's `tray_output none` so the watcher name is free to claim.
exec_always --no-startup-id ~/.config/sway/scripts/tray.sh

exec_always --no-startup-id swayidle -w \
    timeout 600 'swaylock -f -c 1e1e2e' \
    timeout 900 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f -c 1e1e2e'