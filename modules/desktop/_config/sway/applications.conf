set $term kitty
set $menu wofi --show drun
set $browser waterfox

exec_always --no-startup-id mako
exec_always --no-startup-id ~/.config/sway/scripts/bar-buttons.sh

exec_always --no-startup-id swayidle -w \
    timeout 600 'swaylock -f -c 1e1e2e' \
    timeout 900 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f -c 1e1e2e'