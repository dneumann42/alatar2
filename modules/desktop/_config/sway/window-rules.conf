for_window [app_id="scratchpad-terminal"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

for_window [app_id="^wallpaper-picker$"] \
    floating enable, \
    resize set width 100 ppt height 100 ppt, \
    move position 0 0

for_window [app_id="yazi"] \
    floating enable, \
    resize set width 60 ppt height 60 ppt

# Swaybar widget launches: the media block opens Strawberry, the date block
# opens calcurse in kitty — both map floating and centred.
# Both the pacman and flatpak builds report the Wayland app_id
# org.strawberrymusicplayer.strawberry (Qt picks it up from the desktop file),
# but match "strawberry" too in case a build reports the bare binary name.
# Strawberry restores its own window geometry, so sway cannot resize it — only
# centring is set here. The title criterion keeps its dialogs (Settings, ...)
# floating without forcing a size on them.

for_window [app_id="^(strawberry|org.strawberrymusicplayer.strawberry)$" title="^Strawberry Music Player$"] \
    floating enable, \
    move position center

for_window [app_id="^(strawberry|org.strawberrymusicplayer.strawberry)$"] \
    floating enable

for_window [app_id="calcurse"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

# The bar's right-side terminal button opens nirsstui in kitty — floating
# and centred, same size as the calcurse window.
for_window [app_id="nirsstui"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

# nomicon (apps/nomicon, the ellipse kit): ellipse hard-codes the Wayland
# app_id to org.ellipse.platform for every app, so nomicon is identified
# by app_id + title — the same pair scripts/nomicon.sh uses to focus it,
# and what keeps future ellipse apps out of this rule's way. Floats at the
# app's own 1280x720, centred.
for_window [app_id="org.ellipse.platform" title="^nomicon$"] \
    floating enable, \
    move position center

# Waterfox: every instance (the $mod+Shift+b shortcut or any launch) maps
# floating at 80% of the screen, centred. Wayland app_id is the binary's
# brand name, confirmed empirically via swaymsg -t get_tree.

for_window [app_id="waterfox"] \
    floating enable, \
    resize set width 80 ppt height 80 ppt, \
    move position center

# Eclipse transparency

for_window [app_id="Eclipse"] opacity set 0.88

# Europa Universalis IV (native Linux build → XWayland window). The game
# asks to go fullscreen on the monitor the launcher recorded (display_index
# in pdx_settings.txt); when that lands on the portrait screen the game is
# stuck at 1080x1920 and only offers 9:16 resolutions. Pin the game window
# to the main monitor so sway moves it there the moment it maps, no matter
# which index the launcher passes.
for_window [class="(?i)^(eu4|Europa Universalis IV)$"] \
    move container to output DP-1
for_window [instance="(?i)^eu4$"] \
    move container to output DP-1