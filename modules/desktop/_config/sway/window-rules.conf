for_window [app_id="scratchpad-terminal"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

for_window [app_id="^wallpaper-picker$"] \
    floating enable, \
    resize set width 100 ppt height 100 ppt, \
    move position 0 0

for_window [app_id="yazi"] \
    floating enable, \
    resize set width 60 ppt height 60 ppt

# Swaybar widget launches: the media block opens Strawberry, the date block
# opens calcurse in kitty — both map floating and centred.
# Both the pacman and flatpak builds report the Wayland app_id
# org.strawberrymusicplayer.strawberry (Qt picks it up from the desktop file),
# but match "strawberry" too in case a build reports the bare binary name.
# Strawberry restores its own window geometry, so sway cannot resize it — only
# centring is set here. The title criterion keeps its dialogs (Settings, ...)
# floating without forcing a size on them.

for_window [app_id="^(strawberry|org.strawberrymusicplayer.strawberry)$" title="^Strawberry Music Player$"] \
    floating enable, \
    move position center

for_window [app_id="^(strawberry|org.strawberrymusicplayer.strawberry)$"] \
    floating enable

for_window [app_id="calcurse"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

# The bar's right-side terminal button opens nirsstui in kitty — floating
# and centred, same size as the calcurse window.
for_window [app_id="nirsstui"] \
    floating enable, \
    resize set width 900 px height 600 px, \
    move position center

# nomicon (apps/nomicon, the ellipse kit): ellipse hard-codes the Wayland
# app_id to org.ellipse.platform for every app, so nomicon is identified
# by app_id + title — the same pair scripts/nomicon.sh uses to focus it,
# and what keeps future ellipse apps out of this rule's way. Floats at the
# app's own 1280x720, centred.
for_window [app_id="org.ellipse.platform" title="^nomicon$"] \
    floating enable, \
    move position center

# Waterfox: every instance (the $mod+Shift+b shortcut or any launch) maps
# floating at 80% of the screen, centred. Wayland app_id is the binary's
# brand name, confirmed empirically via swaymsg -t get_tree.

for_window [app_id="waterfox"] \
    floating enable, \
    resize set width 80 ppt height 80 ppt, \
    move position center

# Pamac manager: GTK4/libadwaita, wayland-native; the app_id is the desktop
# file's application id. Same floating treatment as the other utility GUIs.
# pamac-manager --updates (the tray's left-click when updates exist) opens
# the same app_id, so this rule covers both entry points.
for_window [app_id="^org.manjaro.pamac.manager$"] \
    floating enable, \
    resize set width 80 ppt height 80 ppt, \
    move position center

# Thunderbird — autostarted by applications.conf and parked on workspace 9
# as the mail workspace. no_focus keeps the mapped windows from stealing
# focus, and sway only follows a moved window when it HAS focus — so the
# session-start move never drags the seat to 9 (one caveat: sway's no_focus
# ignores the first window on a workspace; if TB is literally the first
# window of the whole session the login may land on 9). The mail bar
# button focuses it instead, which switches to 9. Tiled on its own
# workspace beats a floating 80% window there — full-screen mail.
# TB 146+ on Wayland reports app_id "org.mozilla.Thunderbird" (the desktop
# file id); the bare "thunderbird|Thunderbird" covers older/X11 builds.
no_focus [app_id="^(thunderbird|Thunderbird|org\.mozilla\.Thunderbird)$"]
for_window [app_id="^(thunderbird|Thunderbird|org\.mozilla\.Thunderbird)$"] \
    move container to workspace 9
for_window [class="(?i)^thunderbird$"] \
    move container to workspace 9

# Eclipse transparency

for_window [app_id="Eclipse"] opacity set 0.88

# Europa Universalis IV (native Linux build → XWayland window). The game
# asks to go fullscreen on the monitor the launcher recorded (display_index
# in pdx_settings.txt); when that lands on the portrait screen the game is
# stuck at 1080x1920 and only offers 9:16 resolutions. Pin the game window
# to the main monitor so sway moves it there the moment it maps, no matter
# which index the launcher passes.
for_window [class="(?i)^(eu4|Europa Universalis IV)$"] \
    move container to output DP-1
for_window [instance="(?i)^eu4$"] \
    move container to output DP-1

for_window [window_type="dialog"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="splash"] floating enable
for_window [window_type="toolbar"] floating enable

# Tray menus: apps that surface their tray/notification menus as managed
# windows map them with the ICCCM menu window types (sway's criteria
# parser accepts normal, dialog, utility, toolbar, splash, menu,
# dropdown_menu, popup_menu, tooltip, notification — anything else makes
# the rule invalid). Anything GTK/Qt pops as override-redirect or an
# xdg-popup never reaches the window manager, so these are the complete
# set of menu windows sway can float.
for_window [window_type="menu"] floating enable
for_window [window_type="dropdown_menu"] floating enable
for_window [window_type="popup_menu"] floating enable

# Discord tray menu. swaybar's SNI support is icon + click only (its tray
# code has a literal `// TODO menu`), so on right-click it just tells
# Discord's StatusNotifierItem to show its menu and Discord renders the
# menu itself as an xdg_toplevel. That window is the app's only unnamed
# surface: app_id and title both empty (verified live via sway IPC and
# an injected ContextMenu call), while the real Discord window reports
# app_id "discord" — so this floats the menu without touching the app.
# Positioned under the pointer (the tray icon the click came from sits
# on the bar above) and borderless, like a menu should look.
for_window [shell="xdg_shell" app_id="^$" title="^$"] \
    floating enable, border none, move position mouse
