set $background     #111318
set $background2    #191c24
set $surface        #20242e
set $surface_alt    #292e3a
set $text           #e6eaf2
set $muted          #9aa4b2
set $accent         #89b4fa
set $accent2        #74c7ec
set $urgent         #f38ba8
set $inactive       #45475a

animation_duration_ms 180
corner_radius 10
gaps inner 8
gaps outer 4
# smart_gaps on

default_border pixel 2
default_floating_border pixel 2
smart_borders on
titlebar_separator disable

blur enable
blur_xray disable
blur_passes 3
blur_radius 5
blur_noise 0.02
blur_brightness 1.0
blur_contrast 1.0
blur_saturation 1.0

shadows enable
shadows_on_csd enable
shadow_blur_radius 18
shadow_color #00000080
shadow_inactive_color #00000050
shadow_offset 0 4

client.focused          $accent       $accent       $text         $accent       $accent
client.focused_inactive $inactive     $surface      $muted        $inactive     $inactive
client.unfocused        $inactive     $background   $muted        $inactive     $inactive
client.urgent           $urgent       $urgent       $text          $urgent       $urgent
client.placeholder      $inactive     $background   $muted         $inactive     $inactive

client.background       $background

# Wallpaper and the other session services: the awww daemon runs as the systemd
# user service wallpaper.service (tied to sway-session.target), not as a sway
# exec. One script publishes the compositor environment to the user manager and
# activates the target, in that order, so the Wayland-dependent units can never
# race the import. exec_always re-runs it after `swaymsg reload`.
exec_always $HOME/.config/sway/scripts/start-session-services.sh