# Monitor layout (left to right):
#   HDMI-A-2 (HP, portrait) | DP-1 (Acer 32", main) | HDMI-A-1 (Samsung)
#
# HDMI-A-2 is physically rotated 90 degrees counterclockwise (top edge
# tilts left), so it needs sway's transform 270 to make content upright.
# Once rotated, its logical size is 1080x1920.
#
# DP-1 MUST own position 0 0: XWayland treats the output at 0,0 as the
# primary display, and games like EU4 (native Linux build) go fullscreen
# there. If the portrait screen sits at 0,0, those games lock themselves
# to 1080x1920 and can't offer widescreen resolutions. The portrait
# screen therefore lives at negative X, to the left of the main display.

output HDMI-A-2 transform 270 pos -1080 0
output DP-1 pos 0 0
output HDMI-A-1 pos 2560 0
