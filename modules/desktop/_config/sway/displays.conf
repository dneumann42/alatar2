# Monitor layout (left to right):
#   HDMI-A-2 (HP, portrait) | DP-1 (Acer 32", main) | HDMI-A-1 (Samsung)
#
# HDMI-A-2 is physically rotated 90 degrees counterclockwise (top edge
# tilts left), so it needs sway's transform 270 to make content upright.
# The bar (position top) then sits on the top of the portrait screen.
# Once rotated, its logical size is 1080x1920, so positions are set
# explicitly to keep everything adjacent and top-aligned.

output HDMI-A-2 transform 270 pos 0 0
output DP-1 pos 1080 0
output HDMI-A-1 pos 3640 0
