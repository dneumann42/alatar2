# ============================================================================
# Swaybar — top dock, translucent so the wallpaper shows through, workspace
# pills, binding-mode indicator, tray, mouse shortcuts, and a rich status
# line from scripts/status.sh (a Nim project in statusbar/, built on
# demand by the wrapper; icons need a Nerd Font).
#
# Note: sway config comments must be on their own line — no trailing ones.
# ============================================================================

set $font JetBrainsMono Nerd Font

# Bar background: $bar_bg / $bar_flat are defined (and themed by the wallust
# include) in appearance.conf, which sway reads before this file.
set $bar_left_margin 48
# Right gap = bar-buttons (3 x 24 = 72, see statusbar/buttons.toml) PLUS
# the apps/tray strip, whose live width barbuttons reads from a heartbeat
# file and folds into the pushed gap — this static value is only the seed
# for swaybar's very first start (72 + a 2-icon strip ≈ 124 here).
set $bar_right_margin 124

bar {
    id       main
    position top
    mode     dock
    height   20

    # room on the bar's sides for the layer-shell button overlays
    # (statusbar/bin/barbuttons, configured in statusbar/buttons.toml).
    # barbuttons pushes corrected gaps live (swaybar applies them without
    # restarting); this line only seeds the first start. Roughly:
    #   left gap  = 2 buttons (nomicon + gear)   ->  48
    #   right gap = 3 buttons (nirsstui + pamac + mail)  ->  72
    #             plus a ~2-icon tray strip      ->  +52 (= $bar_right_margin)
    # Syntax is gaps <top> <right> <bottom> <left>.
    gaps 0 $bar_right_margin 0 $bar_left_margin

    # Nerd Font so workspace/status glyphs (icons) render
    font pango:$font 11

    # --- workspace pills ---
    workspace_buttons     yes
    workspace_min_width   42
    # mouse wheel cycles past first/last workspace
    wrap_scroll           yes

    # --- shows a "resize" pill when $mod+r binding mode is active ---
    binding_mode_indicator yes

    # --- status line ---
    status_command      ~/.config/sway/scripts/status.sh
    status_padding       8
    status_edge_padding  16

    # --- system tray (all outputs; swaybar handles this without races) ---
    # NOTE: while the apps/tray project matures, `tray_output none` here
    # releases org.kde.StatusNotifierWatcher to the tinydbus host instead.
    tray_output none
    tray_padding 0

    # --- mouse on the bar ---
    # wheel over workspace buttons already switches workspaces;
    # middle-click anywhere on the bar jumps to the previous workspace.
    bindsym button2 workspace back_and_forth

    colors {
        background $bar_bg
        statusline $text
        separator  $inactive

        # border    background  text
        focused_workspace   $accent      $accent      $bar_flat
        active_workspace    $surface_alt $surface     $text
        # inactive pills blend into the translucent bar (same color+alpha)
        inactive_workspace  $bar_bg      $bar_bg      $muted
        urgent_workspace    $urgent      $urgent      $bar_flat
        binding_mode        $accent2     $accent2     $bar_flat
    }
}
