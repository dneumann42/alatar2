# ============================================================================
# Bar: swaybar is retired. Its whole job - workspace pills, binding-mode
# indicator, status line, tray and side buttons - now runs as one ellipse
# layer-shell surface per output, built from apps/bar and launched by
# scripts/bar.sh (see applications.conf). The mouse shortcuts bar.conf used
# to declare (wheel over the pills, middle-click back_and_forth) live in
# the bar itself.
#
# Where the old file configured sway, the equivalents now live in:
#   height 20 / position top / dock   -> apps/bar/src/bar.nim (barH, layer)
#   colours (accent pills, dim bar)   -> appearance.conf's $vars, re-read by
#                                        the bar from here + the wallust
#                                        include at runtime (bar/palette.nim)
#   workspace buttons / min width 42 -> bar.nim pill layout
#   binding_mode_indicator            -> bar.nim mode pill (IPC mode events)
#   status_command scripts/status.sh  -> the same statusbar binary, spawned
#                                        by the bar (bar/statusline.nim)
#   tray + gaps + barbuttons          -> buttons.toml drawn in-surface, SNI
#                                        host integrated (tray modules)
# ============================================================================
