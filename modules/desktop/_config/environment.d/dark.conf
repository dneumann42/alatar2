GTK_THEME=Adwaita:dark
# libadwaita (GTK4 apps like pamac) ignores GTK_THEME — it picks light/dark
# from AdwStyleManager, which reads the xdg Settings color-scheme portal.
# No portal under sway implements that interface (portal-wlr is screensharing
# only), so without this the libadwaita apps fall back to light. This debug
# override is the accepted headless-desktop hook (same mechanism as the
# GNOME setting, minus the portal).
ADW_DEBUG_COLOR_SCHEME=prefer-dark
QT_QPA_PLATFORMTHEME=gtk3
QT_STYLE_OVERRIDE=adwaita-dark
