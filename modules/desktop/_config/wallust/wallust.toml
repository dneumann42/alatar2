backend = "fastresize"

palette = "salience"
salience = { sampling = "high", intensity = "vibrant" }
saturation = 45
check_contrast = true
style = "dark"
alpha = 85

[templates]
sway  = { template = 'sway-theme.conf.j2', target = '~/.cache/wallust/sway-theme.conf' }
kitty = { template = 'kitty-theme.conf.j2', target = '~/.cache/wallust/kitty-theme.conf' }
emacs = { template = 'emacs-theme.el.j2', target = '~/.cache/wallust/wallust.el' }
mako  = { template = 'mako.conf.j2', target = '~/.cache/wallust/mako.conf' }
opencode = { template = 'opencode-theme.json.j2', target = '~/.config/opencode/themes/wallust.json' }

[templated_hooks]
sway = """swaymsg reload 2>/dev/null || true"""
mako = """makoctl reload 2>/dev/null || true"""
emacs = """emacsclient -e '(let ((f (expand-file-name "~/.cache/wallust/wallust.el"))) (when (file-exists-p f) (load f) (mapc (function disable-theme) custom-enabled-themes) (ignore-errors (enable-theme (quote wallust)))))' 2>/dev/null || true"""
notify = """
magick \\( -size 24x24 xc:'{{ color0 }}' -size 24x24 xc:'{{ color1 }}' -size 24x24 xc:'{{ color2 }}' -size 24x24 xc:'{{ color3 }}' -size 24x24 xc:'{{ color4 }}' -size 24x24 xc:'{{ color5 }}' -size 24x24 xc:'{{ color6 }}' -size 24x24 xc:'{{ color7 }}' +append \\) \\( -size 24x24 xc:'{{ color8 }}' -size 24x24 xc:'{{ color9 }}' -size 24x24 xc:'{{ color10 }}' -size 24x24 xc:'{{ color11 }}' -size 24x24 xc:'{{ color12 }}' -size 24x24 xc:'{{ color13 }}' -size 24x24 xc:'{{ color14 }}' -size 24x24 xc:'{{ color15 }}' +append \\) -append ~/.cache/wallust/palette.png 2>/dev/null || true
notify-send -t 5000 -i ~/.cache/wallust/palette.png 'wallust: {{ palette }} palette from {{ wallpaper | basename }}' 'bg #000000 (pinned)   fg {{ foreground }}
c1 {{ color1 }}   c2 {{ color2 }}   c3 {{ color3 }}   c4 {{ color4 }}
c5 {{ color5 }}   c6 {{ color6 }}   c8 {{ color8 }}' 2>/dev/null || true
"""
opencode = """pkill -USR2 opencode"""