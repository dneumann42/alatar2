# ============================================================================
# System units this module needs the PID 1 manager to run. alatar's own
# units (blueman-applet.service) are user units; the adapter daemon lives
# on the system side and a user unit cannot pull one up. Bluez used to be
# D-Bus activated, but the current packages only ship an org.bluez
# system-service file pointing at dbus-org.bluez.service - a unit that no
# longer exists - so bluetooth.service must be enabled to have bluetoothd.
# ============================================================================

[[unit]]
name = "bluetooth.service"   # bluetoothd, the org.bluez adapter daemon
