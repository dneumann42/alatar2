# This module owns the Bluetooth stack: the bluez daemon and its CLI client
# (moved here from desktop's packages.toml - declaring a package in two
# places breaks the install order, like every other duplicated package),
# plus blueman: the GUI client (blueman-manager) and the session applet
# (blueman-applet) that this module runs as blueman-applet.service.
#
# Why these pieces:
# * bluez is a system-side daemon (bluetooth.service); this module declares
#   it in systemd.toml, so `alatar install` enables and starts it (the
#   legacy D-Bus activation is gone: org.bluez's system-service file points
#   at a unit current bluez no longer ships).
# * blueman ships its own StatusNotifierItem implementation (no XEmbed, no
#   appindicator library), so the applet's icon registers on the session
#   bus and lands in the bar's tray zone - apps/bar hosts the SNI watcher,
#   same as pamac-tray's. Clicking it opens blueman-manager, which is also
#   launchable standalone; pairing/authorization dialogs reach the polkit
#   agent owned by desktop/polkit.
# * bluez-obex runs obexd, which blueman uses for device battery level.
# * Bluetooth audio needs no extra pipewire package on arch: the bluez5
#   backend (libspa-bluez5) ships inside pipewire-audio, declared in the
#   parent desktop module, which installs before this submodule.

[[package]]
name = "bluez"
source = "arch"
tags = ["system", "bluetooth"]

[[package]]
name = "bluez-utils"
source = "arch"
tags = ["system", "bluetooth", "cli"]

[[package]]
name = "blueman"
source = "arch"
tags = ["bluetooth", "gui", "wayland"]

[[package]]
name = "bluez-obex"
source = "arch"
tags = ["bluetooth"]
