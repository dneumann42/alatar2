# This module owns the desktop theme: wallust extracts a palette from the
# wallpaper and generates ~/.cache/wallust/*-theme.conf (config and templates
# in desktop/_config/wallust), which sway and kitty include.
[[package]]
name = "wallust-git"
source = "aur"
tags = ["desktop", "theming"]

# This module owns wallpaper.service, so the awww daemon it runs is declared
# here: a module's own packages are installed before its own units.
[[package]]
name = "awww"
source = "arch"
tags = ["desktop", "theming", "wayland"]
