# ============================================================================
# Proton Mail + Thunderbird, all declarative except the login.
#
# Pieces:
#   - packages: protonmail-bridge (declared in ../packages.toml) and
#     thunderbird.
#   - vars.toml + fs.toml: PROTON_EMAIL / PROTON_REALNAME are asked once
#     (persisted to the systemd user environment +
#     ~/.config/environment.d/50-alatar-vars.conf) and land in
#     ~/.config/alatar/email.json.
#   - the profile seeds below: a deterministic profile
#     (alatar.default-release), its user.js flags, and the extension drop-in
#     (symlink.toml) - together that is what makes account provisioning
#     automatic. The [InstallFDC34C9F024745EB] Locked=1 stanza is NOT noise:
#     the branded Thunderbird launcher's own profile mapping outranks
#     Profile0/Default=1, and without pointing it at alatar.default-release
#     the very first start re-creates a random profile next to ours.
#   - protonmail-bridge.service.toml: the Bridge daemon (IMAP 127.0.0.1:1143,
#     SMTP 127.0.0.1:1025), started with the sway session.
#
# How the provisioning works (all verified on Arch Thunderbird 159; older
# knowledge is wrong on this build):
#   - distribution/extensions is DEAD: TB 159 ships no Distribution.jsm and
#     scans nothing there (tested with real files).
#   - the live hook is the profile cell <profile>/extensions/<em:id>.xpi -
#     the filename MUST be the id (a differently-named xpi is installed by
#     the scan but never activated) - and it only auto-enables with
#     extensions.autoDisableScopes=0, which is why user.js is seeded before
#     the very first start. experiments.enabled=true lets the unsigned
#     add-on register its experiment API (Arch builds set
#     MOZ_REQUIRE_SIGNING=0, so the pref is honoured).
#   - a file newly dropped into the cell on a start is only loaded NEXT
#     start; a VERSION BUMP hot-reloads it - so the first post-install start
#     may need a second Thunderbird restart to run provisioning. The add-on
#     is idempotent (findServer guard) and reports to the char pref
#     mail.protonbridge.provision.last (readable in the profile prefs.js).
#   - bootstrapped/legacy add-ons are dead too (XPIDatabase.isDisabledLegacy
#     disables every non-webextension outside automation).
#   - what the add-on creates: IMAP 127.0.0.1:1143 SSL + SMTP
#     127.0.0.1:1025 STARTTLS, normal-password auth, via
#     CreateInBackend.createAccountInBackend (the same path TB's own
#     thundermail built-in uses).
#
# What stays interactive (the point of it all): authenticate.
#   1. Attach the GUI to the running daemon: just `protonmail-bridge` - a
#      window opens (it talks to the systemd daemon over its gRPC socket;
#      that is why the unit runs `bridge --grpc`). Log the Proton account
#      in there; the per-user CLIENT PASSWORD (what Thunderbird must use -
#      NOT the Proton password) is shown in the account list / via the
#      key icon. TUI alternative: `systemctl --user stop
#      protonmail-bridge; /usr/lib/protonmail/bridge/bridge --cli` (add
#      user, show password), then start the unit again.
#      NOTE: bare `protonmail-bridge --cli` does NOT work - the wrapper is
#      the Qt GUI and swallows the flag.
#   2. Open Thunderbird (second start after `alatar install email`): the
#      account appears by itself; it asks that client password once per
#      server and a one-time certificate exception for the Bridge's own
#      127.0.0.1 cert. New-mail alerts then go to mako via libnotify.
# ============================================================================

[[directory]]
path = "~/.thunderbird/alatar.default-release/extensions"

[[file]]
path = "~/.thunderbird/profiles.ini"
content = "[General]\nStartWithLastProfile=1\nVersion=2\n\n[Profile0]\nName=alatar\nIsRelative=1\nPath=alatar.default-release\nDefault=1\n\n[InstallFDC34C9F024745EB]\nDefault=alatar.default-release\nLocked=1\n"

[[file]]
path = "~/.thunderbird/alatar.default-release/user.js"
content = "// Generated by alatar desktop/email: makes the profile cell auto-enable\n// the provisioning add-on and lets its experiment API load (unsigned).\nuser_pref(\"extensions.autoDisableScopes\", 0);\nuser_pref(\"extensions.enabledScopes\", 15);\nuser_pref(\"extensions.experiments.enabled\", true);\n"

[[file]]
path = "~/.config/alatar/email.json"
content = "{\"proton_email\": \"${PROTON_EMAIL}\", \"realname\": \"${PROTON_REALNAME}\"}\n"
