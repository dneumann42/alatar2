<!doctype html>
<html>
<head>
  <title>Alatar</title>
  <style>
    * { all: unset; }
    style { display: none; }
    body {
      background-color:#000000;
      color: white;
    }
    h1 { font-size: 4em; }
    div { display: flex; flex-direction: column; }
    span { display: flex; flex-direction: row; }
    input { border: 1px solid white; }
    button { border: 1px solid blue; background-color: #999; }
    a { border: 1px solid blue; background-color: #999; display: block; }
    .flex { display: flex; }
    .flex-row { flex-direction: row; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .items-stretch { align-items: stretch; }
    .justify-start { justify-content: flex-start; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .flex-1 { flex: 1; }
    .gap-sm { gap: 0.5rem; }
    .gap-md { gap: 1rem; }
    .w100 { width: 100vw; }
    .h100 { height: 100vh; }
  </style>
</head>
<body class="flex flex-column justify-center items-center w100 h100">
  <div class="items-start">
    <h1> Alatar </h1>

    <form action="https://duckduckgo.com/" method="get" target="_blank">
      <input name="q" type="search" placeholder="Search DuckDuckGo" required>
      <button type="submit">Search</button>
    </form>
    
    <a href="https://duck.ai/" target="_blank"> Duck AI </a>
  </div>
  <div> </div>
</body>
</html>
